<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розклад чергувань</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-amber: #f59e0b;
            --accent-purple: #a855f7;
            --today-glow: rgba(56, 189, 248, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 12px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            padding: 16px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--card-border);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .month-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
        }

        .nav-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .nav-btn:hover {
            background: #475569;
        }

        .current-month-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent-blue);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        /* Підсвітка для сьогоднішнього дня */
        .card.is-today {
            border: 2px solid var(--accent-blue);
            box-shadow: 0 0 20px var(--today-glow);
            background: linear-gradient(145deg, #1e293b, #0f2744);
        }

        /* Дні з наступного місяця */
        .card.is-next-month {
            opacity: 0.8;
            border-style: dashed;
            background: #182232;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        /* ВЕЛИКИЙ ШРИФТ ДАТИ */
        .date-number {
            font-size: 3rem;
            font-weight: 900;
            line-height: 1;
            color: #ffffff;
            letter-spacing: -1px;
        }

        .card.is-today .date-number {
            color: var(--accent-blue);
        }

        .date-info {
            text-align: right;
        }

        .day-name {
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-sub);
        }

        .month-name {
            font-size: 0.85rem;
            color: var(--accent-blue);
            font-weight: 600;
        }

        .today-badge {
            background-color: var(--accent-blue);
            color: #0f172a;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 8px;
        }

        .next-month-badge {
            background-color: #334155;
            color: var(--text-sub);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .duty-section {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--card-border);
        }

        .duty-label {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .duty-person {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .person-me {
            color: var(--accent-amber);
        }

        .person-ruslan {
            color: var(--accent-green);
        }

        .person-off {
            color: var(--text-sub);
        }

        .shift-time {
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 4px;
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 480px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🗓️ Графік чергувань</h1>
        <div class="month-nav">
            <button class="nav-btn" onclick="changeMonth(-1)">← Попередній</button>
            <div id="currentMonthLabel" class="current-month-title">Липень 2026</div>
            <button class="nav-btn" onclick="changeMonth(1)">Наступний →</button>
        </div>
    </header>

    <div class="grid" id="scheduleGrid"></div>
</div>

<script>
    const ukMonths = [
        "Січень", "Лютий", "Березень", "Квітень", "Травень", "Червень",
        "Липень", "Серпень", "Вересень", "Жовтень", "Листопад", "Грудень"
    ];

    const ukDaysShort = ["Нд", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
    const ukDaysFull = ["Неділя", "Понеділок", "Вівторок", "Середа", "Четвер", "П'ятниця", "Субота"];

    // Поточна дата
    let viewDate = new Date();
    const today = new Date();

    // Розрахунок чергування для даної дати
    function getDutyForDate(date) {
        const year = date.getFullYear();
        const month = date.getMonth(); // 0-indexed
        const day = date.getDate();

        // 1) Точні налаштування для вказаних днів (Липень/Серпень 2026)
        if (year === 2026 && month === 6 && day === 30) {
            // Четвер, 30 липня - Я на 8:00
            return { person: "Я", time: "Вихід о 08:00", isMe: true, isOff: false };
        }
        if (year === 2026 && month === 6 && day === 31) {
            // П'ятниця, 31 липня - Руслан на 8:00
            return { person: "Руслан", time: "Вихід о 08:00", isMe: false, isOff: false };
        }
        if (year === 2026 && month === 7 && day === 1) {
            // Субота, 1 серпня
            return { person: "Руслан", time: "Вихід о 08:00", isMe: false, isOff: false };
        }
        if (year === 2026 && month === 7 && day === 2) {
            // Воскресенье, 2 августа - Вихідний
            return { person: "Я (Вихідний)", time: "Вихідний", isMe: false, isOff: true };
        }

        // 2) Алгоритм чергування для інших днів
        // Чередування 2 через 2 або за днет тижня
        const dayOfWeek = date.getDay(); // 0 - Нд, 6 - Сб
        
        if (dayOfWeek === 0) {
            // У неділю - вихідний
            return { person: "Вихідний", time: "—", isMe: false, isOff: true };
        }

        // Парні/непарні дні для автоматичного розкладу
        if (day % 2 === 0) {
            return { person: "Я", time: "Вихід о 08:00", isMe: true, isOff: false };
        } else {
            return { person: "Руслан", time: "Вихід о 08:00", isMe: false, isOff: false };
        }
    }

    function renderSchedule() {
        const grid = document.getElementById("scheduleGrid");
        grid.innerHTML = "";

        const year = viewDate.getFullYear();
        const month = viewDate.getMonth();

        // Оновлюємо заголовок місяця
        document.getElementById("currentMonthLabel").innerText = `${ukMonths[month]} ${year}`;

        // Отримуємо всі дні поточного місяця
        let daysToRender = [];
        let curr = new Date(year, month, 1);

        while (curr.getMonth() === month) {
            daysToRender.push(new Date(curr));
            curr.setDate(curr.getDate() + 1);
        }

        // Втраплені дні наступного місяця ДО БЛИЖЧОГО ВОСКРЕСІННЯ ВКЛЮЧНО
        // curr зараз стоїть на 1-му числі наступного місяця
        let lastDayOfCurrentMonth = daysToRender[daysToRender.length - 1];
        let dayOfWeekLast = lastDayOfCurrentMonth.getDay(); // 0 = Нд, 5 = Пт, 6 = Сб

        // Якщо місяць закінчився не в неділю, додаємо дні наступного місяця до неділі
        if (dayOfWeekLast !== 0) {
            while (true) {
                daysToRender.push(new Date(curr));
                if (curr.getDay() === 0) {
                    // Зупиняємося, коли додали неділю
                    break;
                }
                curr.setDate(curr.getDate() + 1);
            }
        }

        // Рендеримо картки
        daysToRender.forEach(date => {
            const isToday = date.toDateString() === today.toDateString();
            const isNextMonth = date.getMonth() !== month;
            const dayNum = date.getDate();
            const dayOfWeekName = ukDaysFull[date.getDay()];
            const monthName = ukMonths[date.getMonth()];

            const duty = getDutyForDate(date);

            const card = document.createElement("div");
            card.className = `card ${isToday ? 'is-today' : ''} ${isNextMonth ? 'is-next-month' : ''}`;

            let personClass = "person-ruslan";
            if (duty.isOff) {
                personClass = "person-off";
            } else if (duty.isMe) {
                personClass = "person-me";
            }

            card.innerHTML = `
                <div>
                    ${isToday ? '<span class="today-badge">Сьогодні</span>' : ''}
                    ${isNextMonth ? '<span class="next-month-badge">Наступний місяць</span>' : ''}
                    <div class="card-header">
                        <div class="date-number">${dayNum}</div>
                        <div class="date-info">
                            <div class="day-name">${dayOfWeekName}</div>
                            <div class="month-name">${monthName}</div>
                        </div>
                    </div>
                </div>

                <div class="duty-section">
                    <div class="duty-label">Черговий:</div>
                    <div class="duty-person ${personClass}">${duty.person}</div>
                    <div class="shift-time">${duty.time}</div>
                </div>
            `;

            grid.appendChild(card);
        });
    }

    function changeMonth(delta) {
        viewDate.setMonth(viewDate.getMonth() + delta);
        renderSchedule();
    }

    // Початковий рендер
    renderSchedule();
</script>

</body>
</html>
